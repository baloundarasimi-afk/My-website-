<!DOCTYPE html>
<html lang="en"> 
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Nexora Battle V1</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10151c;font-family:Arial,sans-serif}
  canvas{display:block;width:100%;height:100%;touch-action:none;background:#17221c}
  #hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none;color:white;font-weight:bold;text-shadow:0 2px 3px #000}
  #start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.65);color:white;text-align:center}
  #startBox{padding:24px;border-radius:18px;background:#18202a;max-width:320px}
  button{border:0;border-radius:12px;padding:14px 24px;font-size:18px;font-weight:bold;background:#21d46b;color:#07140c}
  #controls{position:fixed;left:15px;right:15px;bottom:15px;display:flex;justify-content:space-between;pointer-events:none}
  .pad{width:125px;height:125px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.25);pointer-events:auto;touch-action:none}
  #fire{width:92px;height:92px;border-radius:50%;background:#ff5b4d;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;border:2px solid rgba(255,255,255,.5);pointer-events:auto;touch-action:none}
  .small{font-size:13px;color:#b9c3cf}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><span id="hp">❤️ 100</span><span id="score">⭐ 0</span></div>

<div id="start">
  <div id="startBox">
    <h1>⚔️ Nexora Battle</h1>
    <p>Version 1 — mobile prototype</p>
    <p class="small">Move with the left pad. Tap FIRE to shoot the enemies.</p>
    <button id="play">PLAY</button>
  </div>
</div>

<div id="controls">
  <div id="move" class="pad"></div>
  <div id="fire">FIRE</div>
</div>

<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');
let W,H,player,enemies=[],bullets=[],score=0,running=false,last=0,spawn=0;
const keys={x:0,y:0};
function resize(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=innerWidth;H=innerHeight}
addEventListener('resize',resize);resize();

function reset(){
  player={x:W/2,y:H/2,r:18,hp:100,speed:190};
  enemies=[];bullets=[];score=0;spawn=0;
  document.getElementById('hp').textContent='❤️ 100';
  document.getElementById('score').textContent='⭐ 0';
}
function spawnEnemy(){
  const side=Math.floor(Math.random()*4);
  let x=side===0? -25:side===1?W+25:Math.random()*W;
  let y=side===2? -25:side===3?H+25:Math.random()*H;
  enemies.push({x,y,r:16,hp:2,speed:55+Math.random()*35});
}
function shoot(){
  if(!running)return;
  const target=enemies.reduce((a,e)=>!a||dist(player,e)<dist(player,a)?e:a,null);
  let dx=0,dy=-1;
  if(target){dx=target.x-player.x;dy=target.y-player.y;let d=Math.hypot(dx,dy)||1;dx/=d;dy/=d}
  bullets.push({x:player.x,y:player.y,dx,dy,speed:430,r:5});
}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function update(dt){
  player.x=Math.max(20,Math.min(W-20,player.x+keys.x*player.speed*dt));
  player.y=Math.max(20,Math.min(H-20,player.y+keys.y*player.speed*dt));
  spawn-=dt;if(spawn<=0){spawnEnemy();spawn=Math.max(.45,1.1-score*.01)}
  bullets.forEach(b=>{b.x+=b.dx*b.speed*dt;b.y+=b.dy*b.speed*dt});
  bullets=bullets.filter(b=>b.x>-20&&b.x<W+20&&b.y>-20&&b.y<H+20);
  for(const e of enemies){
    const dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;
    e.x+=dx/d*e.speed*dt;e.y+=dy/d*e.speed*dt;
    if(d<e.r+player.r){player.hp-=22*dt}
  }
  for(const b of bullets){
    for(const e of enemies){
      if(e.hp>0&&Math.hypot(b.x-e.x,b.y-e.y)<b.r+e.r){e.hp--;b.x=-999; if(e.hp<=0)score++}
    }
  }
  enemies=enemies.filter(e=>e.hp>0);
  document.getElementById('hp').textContent='❤️ '+Math.max(0,Math.ceil(player.hp));
  document.getElementById('score').textContent='⭐ '+score;
  if(player.hp<=0){running=false;document.getElementById('startBox').innerHTML='<h1>💥 Game Over</h1><p>Score: '+score+'</p><button id="play">PLAY AGAIN</button>';document.getElementById('start').style.display='flex';document.getElementById('play').onclick=start}
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#1b2a20';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,.06)';ctx.lineWidth=1;
  for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
  for(const e of enemies){ctx.fillStyle='#e84b4b';ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(e.x-5,e.y-3,3,0,Math.PI*2);ctx.arc(e.x+5,e.y-3,3,0,Math.PI*2);ctx.fill()}
  for(const b of bullets){ctx.fillStyle='#ffd34d';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill()}
  ctx.fillStyle='#36a8ff';ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(player.x-6,player.y-4,3,0,Math.PI*2);ctx.arc(player.x+6,player.y-4,3,0,Math.PI*2);ctx.fill();
}
function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;if(running)update(dt);draw();requestAnimationFrame(loop)}
function start(){document.getElementById('start').style.display='none';reset();running=true}
document.getElementById('play').onclick=start;

const pad=document.getElementById('move');
let pid=null;
pad.addEventListener('pointerdown',e=>{pid=e.pointerId;pad.setPointerCapture(pid);move(e)});
pad.addEventListener('pointermove',e=>{if(e.pointerId===pid)move(e)});
pad.addEventListener('pointerup',()=>{keys.x=keys.y=0;pid=null});
pad.addEventListener('pointercancel',()=>{keys.x=keys.y=0;pid=null});
function move(e){
  const r=pad.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  let dx=e.clientX-cx,dy=e.clientY-cy,d=Math.hypot(dx,dy)||1,m=Math.min(1,d/(r.width*.38));
  keys.x=dx/d*m;keys.y=dy/d*m;
}
document.getElementById('fire').addEventListener('pointerdown',shoot);
requestAnimationFrame(loop);
</script>
</body>
</html>
